<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="img/ui/favicon.png">
  <title>Olympus</title>
  <link rel="stylesheet" href="css/game.css?v=tjijsp">
</head>
<body>

<!-- ===== HORNÍ TMAVÝ PRUH ===== -->
<div class="topbar">
  <div class="topbar-inner">
    <a class="topbar-link" onclick="openView('settings')">Nastavení</a>
    <a class="topbar-link admin-link" id="adminLink" style="display:none" onclick="openView('admin')">Admin</a>
    <a class="topbar-link" onclick="logout()">Odhlásit</a>
  </div>
</div>

<!-- ===== HLAVIČKA S RESOURCE BOXY ===== -->
<div class="headerband">
  <div class="hb-inner">

    <!-- Ikonky -->
    <div class="hb-box hb-icons">
      <div class="hb-icon" onclick="openView('news')"     title="Novinky a aktualizace"><img src="img/ui/btn-news.png"   alt="Novinky"><i class="badge" id="badgeNews"></i></div>
      <div class="hb-icon" onclick="openView('fights')"   title="Historie soubojů"><img src="img/ui/btn-fights.png" alt="Souboje"><i class="badge" id="badgeFights"></i></div>
      <div class="hb-icon" onclick="openView('messages')" title="Zprávy"><img src="img/ui/btn-inbox.png"  alt="Zprávy"><i class="badge" id="badgeInbox"></i></div>
      <div class="hb-icon" onclick="openView('loot')"     title="Kořist z výprav"><img src="img/ui/btn-loot.png"   alt="Zásilky"><i class="badge" id="badgeLoot"></i></div>
    </div>

    <!-- Zdroje + pruhy -->
    <div class="hb-box hb-res">
      <div class="hb-res-row">
        <span class="res"><img class="res-ico" src="img/ui/coin.png" alt="Zlato"><b id="navGold">0</b></span>
        <span class="res"><img class="res-ico" src="img/ui/gem.png" alt="Smaragdy"><b id="navRuby">0</b></span>
      </div>
      <div class="hb-res-row">
        <span class="res"><i>⭐</i><b id="navLevel">1</b></span>
        <span class="res" title="Pocta z arény"><i>🏅</i><b id="navPocta">0</b></span>
      </div>
      <div class="hb-bars">
        <div class="hb-bar-row" data-tip="hp">
          <div class="gbar gbar-hp"><div class="gbar-fill" id="hpBar" style="width:0%"></div></div>
          <span class="gbar-pct" id="hpPct">0 %</span>
        </div>
        <div class="hb-bar-row" data-tip="xp">
          <div class="gbar gbar-xp"><div class="gbar-fill" id="xpBar" style="width:0%"></div></div>
          <span class="gbar-pct" id="xpPct">0 %</span>
        </div>
      </div>
    </div>

    <!-- Výpravy -->
    <div class="hb-box hb-actions">
      <div class="hb-act-row">
        <span class="hb-act-icon">🗺️</span>
        <span class="hb-act-count" id="expedPts">– / –</span>
        <button class="btn-green" id="btnExped" onclick="openView('expedition')">Jít na výpravu</button>
      </div>
      <div class="hb-act-row">
        <span class="hb-act-icon">🏰</span>
        <span class="hb-act-count" id="dungeonPts">– / –</span>
        <button class="btn-green" id="btnDungeon" onclick="openView('dungeon')">Jít do bludiště</button>
      </div>
    </div>

    <!-- Aréna -->
    <div class="hb-box hb-actions">
      <div class="hb-act-row">
        <span class="hb-act-icon">🔥</span>
        <span class="hb-act-count">56</span>
        <button class="btn-green" onclick="openView('arena')">Jít do Arény</button>
      </div>
      <div class="hb-act-row">
        <span class="hb-act-icon">🛡️</span>
        <span class="hb-act-count">32</span>
        <button class="btn-green" onclick="openView('arena')">Jít do Circus Turma</button>
      </div>
    </div>

  </div>
</div>

<!-- ===== HLAVNÍ PLOCHA ===== -->
<div class="game-container">

  <!-- ===== LEVÝ ČERVENÝ BANNER ===== -->
  <aside class="left-banner">
    <div class="banner-top"><img class="banner-logo" src="img/ui/logo.png" alt="Olympus"></div>

    <div class="banner-body">
      <div class="menu-list">
        <a class="menu-btn active" id="menu-profile" onclick="openView('profile')">Přehled</a>
        <a class="menu-btn"        id="menu-quests"  onclick="openView('quests')">Mise</a>
        <a class="menu-btn"        id="menu-guild"   onclick="openView('guild')">Gilda</a>
        <a class="menu-btn"        id="menu-hall"    onclick="openView('hall')">Síň slávy</a>
        <a class="menu-btn premium" id="menu-premium" onclick="openView('premium')"><span class="gem">💠</span>Prémium</a>
      </div>

      <div class="submenu">
        <div class="submenu-tabs">
          <div class="sub-tab active" title="Město"
               onmouseenter="subTab(this,0)" onclick="openView('city')">🏛️</div>
          <div class="sub-tab" title="Výpravy"
               onmouseenter="subTab(this,1)" onclick="openView('expedition')">🗺️</div>
        </div>
        <!-- záložka 0: budovy města -->
        <div class="submenu-body" id="submenu-city">
          <a class="sub-item" id="menu-work"      onclick="openView('work')">Práce</a>
          <a class="sub-item" id="menu-arena"     onclick="openView('arena')">Aréna</a>
          <a class="sub-item" id="menu-training"  onclick="openView('training')">Cvičiště</a>
          <a class="sub-item" id="menu-shop"      onclick="openMerchant('blacksmith')">Zbrojíř</a>
          <a class="sub-item" id="menu-armorer"   onclick="openMerchant('armorer')">Platnéř</a>
          <a class="sub-item" id="menu-alchemy"   onclick="openMerchant('alchemist')">Alchymista</a>
          <a class="sub-item" id="menu-jeweler"   onclick="openMerchant('jeweler')">Klenotník</a>
          <a class="sub-item" id="menu-forge"     onclick="openView('forge')">Kovárna</a>
          <a class="sub-item" id="menu-market"    onclick="openView('market')">Tržiště</a>
          <a class="sub-item" id="menu-auction"   onclick="openView('auction')">Aukční síň</a>
        </div>

        <!-- záložka 1: mapa výprav (plní game.js) -->
        <div class="submenu-body" id="submenu-map" style="display:none"></div>
      </div>
    </div>

    <div class="banner-bottom"></div>
  </aside>

  <!-- ===== OBSAH ===== -->
  <main class="content-area">
    <div class="parchment" id="centerContent"></div>
  </main>

</div>

<!-- skryté prvky které používá updateUI() -->
<!-- žebříček a denní odměna jsou v Síni slávy, ne tady -->
<div style="display:none">
  <span id="navName"></span>
  <span id="charNameSm"></span>
  <span id="charClassSm"></span>
  <span id="charAvatarSm"></span>
  <span id="sHealth"></span><span id="sStr"></span><span id="sDef"></span>
  <span id="sAgi"></span><span id="sInt"></span>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="levelUpModal" style="display:none;">
  <div class="modal-content">
    <div class="modal-icon">⭐</div>
    <h2>POSTOUPIL JSI!</h2>
    <p>Dosáhl jsi úrovně <strong id="newLevel">2</strong>!</p>
    <p class="modal-rewards">+10 Zdraví · +2 Síla · +1 Obrana · +1 Hbitost</p>
    <button onclick="document.getElementById('levelUpModal').style.display='none'" class="btn-green big">Sláva Olympu!</button>
  </div>
</div>

<script src="js/api.js?v=tjijsp"></script>
<script src="js/avatars.js?v=tjijsp"></script>
<script src="js/game.js?v=tjijsp"></script>

<script>
  // Najeti mysi jen prepne, co je v nabidce videt.
  // Otevrit Mesto nebo Vypravy se musi kliknutim.
  function subTab(el, idx) {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('submenu-city').style.display = idx === 0 ? '' : 'none';
    const map = document.getElementById('submenu-map');
    map.style.display = idx === 1 ? '' : 'none';
    if (idx === 1) map.innerHTML = expedMenuHTML();
  }
</script>

</body>
</html>
