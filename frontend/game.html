<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gladiátor - Aréna Bohů</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

<!-- TOP MENU BAR -->
<div class="top-menu">
  <div class="top-menu-left">
    <div class="game-title">⚔ OLYMPUS ⚔</div>
  </div>
  <nav class="top-nav">
    <a class="top-nav-item active" onclick="openView('city')">🏛 Město</a>
    <a class="top-nav-item" onclick="openView('arena')">⚔ Aréna</a>
    <a class="top-nav-item" onclick="openView('dungeon')">🏰 Dungeon</a>
    <a class="top-nav-item" onclick="openView('quests')">📜 Úkoly</a>
    <a class="top-nav-item" onclick="openView('shop')">🏪 Obchod</a>
    <a class="top-nav-item" onclick="openView('tavern')">🍺 Taverna</a>
    <a class="top-nav-item" onclick="openView('inventory')">🎒 Inventář</a>
    <a class="top-nav-item" onclick="openView('profile')">👤 Profil</a>
  </nav>
  <div class="top-menu-right">
    <div class="gold-display">💰 <span id="navGold">0</span></div>
    <button class="btn-logout" onclick="logout()">Odhlásit</button>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="game-container">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar left-sidebar">
    <div class="sidebar-char">
      <div class="char-avatar" id="charAvatarSm"></div>
      <div class="char-name" id="charNameSm">-</div>
      <div class="char-class" id="charClassSm">-</div>
      <div class="char-level">Lv. <span id="charLevelSm">1</span></div>
    </div>

    <div class="sidebar-stats">
      <div class="stat-row">
        <span class="stat-icon">❤️</span>
        <span class="stat-name">Zdraví</span>
        <span class="stat-val" id="sHealth">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">⚔️</span>
        <span class="stat-name">Síla</span>
        <span class="stat-val" id="sStr">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">🛡️</span>
        <span class="stat-name">Obrana</span>
        <span class="stat-val" id="sDef">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">💨</span>
        <span class="stat-name">Hbitost</span>
        <span class="stat-val" id="sAgi">-</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">🔮</span>
        <span class="stat-name">Intelekt</span>
        <span class="stat-val" id="sInt">-</span>
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-info">
      <div class="info-label">Zkušenosti</div>
      <div class="xp-bar-container">
        <div class="xp-bar-bg">
          <div class="xp-bar-fill" id="xpBar" style="width: 0%"></div>
        </div>
        <div class="xp-text" id="xpVal">0 XP</div>
      </div>
    </div>
  </aside>

  <!-- CENTER CONTENT -->
  <main class="center-content" id="centerContent">
    <!-- Dynamically loaded views -->
  </main>

  <!-- RIGHT SIDEBAR -->
  <aside class="sidebar right-sidebar">
    <div class="sidebar-widget">
      <div class="widget-title">🏆 Leaderboard</div>
      <div class="leaderboard" id="leaderboard"></div>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-widget">
      <div class="widget-title">🎁 Denní odměna</div>
      <button class="btn-daily" id="dailyBtn" onclick="claimDaily()">Převzít odměnu</button>
    </div>
  </aside>

</div>

<!-- MODALS -->
<div class="modal-overlay" id="levelUpModal" style="display: none;">
  <div class="modal-content">
    <div class="modal-icon">⭐</div>
    <h2>POSTOUPIL JSI!</h2>
    <p>Dosáhl jsi úrovně <strong id="newLevel">2</strong>!</p>
    <p class="modal-rewards">+10 Zdraví · +2 Síla · +1 Obrana · +1 Hbitost</p>
    <button onclick="document.getElementById('levelUpModal').style.display='none'" class="modal-btn">⚔ Sláva Olympu!</button>
  </div>
</div>

<!-- SCRIPTS -->
<script src="js/api.js"></script>
<script src="js/avatars.js"></script>
<script src="js/auth.js"></script>
<script src="js/character.js"></script>
<script src="js/game.js"></script>

</body>
</html>
